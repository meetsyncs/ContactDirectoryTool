<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JM Partners — Contact Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ─── RESET & BASE ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:          #f0f4ff;
  --bg2:         #e8eeff;
  --surface:     rgba(255,255,255,0.92);
  --surface2:    rgba(255,255,255,0.6);
  --border:      rgba(99,102,241,0.14);
  --border2:     rgba(99,102,241,0.28);
  --indigo:      #4F46E5;
  --indigo-d:    #3730a3;
  --indigo-l:    #818cf8;
  --indigo-xl:   #e0e7ff;
  --indigo-xxl:  #eef2ff;
  --green:       #16a34a;
  --green-l:     #dcfce7;
  --green-d:     #14532d;
  --amber:       #d97706;
  --amber-l:     #fef3c7;
  --amber-d:     #78350f;
  --red:         #dc2626;
  --red-l:       #fee2e2;
  --text:        #1e1b4b;
  --text2:       #4b5563;
  --text3:       #9ca3af;
  --radius:      14px;
  --radius-sm:   8px;
  --shadow-card: 0 2px 16px rgba(99,102,241,0.08), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-hover: 0 8px 32px rgba(99,102,241,0.18), 0 2px 8px rgba(0,0,0,0.06);
  --transition:  all 0.22s cubic-bezier(.4,0,.2,1);
  font-family: 'DM Sans', sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(99,102,241,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%, rgba(139,92,246,0.08) 0%, transparent 60%);
}

/* ─── TOPBAR ──────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(240,244,255,0.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(99,102,241,0.35);
}
.logo-icon svg { width: 20px; height: 20px; }
.logo-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
.logo-sub  { font-size: 11px; color: var(--indigo-l); margin-top: 1px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.count-pill {
  font-size: 11px; font-weight: 500;
  padding: 4px 12px; border-radius: 20px;
  background: var(--indigo-xl); color: var(--indigo);
  border: 1px solid rgba(99,102,241,0.25);
}
.btn {
  font-family: inherit; font-size: 12px; font-weight: 500;
  padding: 7px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface); color: var(--indigo);
  cursor: pointer; transition: var(--transition);
  white-space: nowrap;
}
.btn:hover { background: var(--indigo-xl); border-color: var(--indigo-l); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.accent {
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  color: #fff; border: none;
  box-shadow: 0 2px 8px rgba(99,102,241,0.3);
}
.btn.accent:hover { box-shadow: 0 4px 16px rgba(99,102,241,0.4); background: linear-gradient(135deg,#3730a3,#6d28d9); }
.btn.danger { color: var(--red); border-color: rgba(220,38,38,0.25); }
.btn.danger:hover { background: var(--red-l); border-color: rgba(220,38,38,0.4); }

/* ─── MAIN LAYOUT ─────────────────────────────────────────────────── */
.main { max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }

/* ─── SEARCH BOX ──────────────────────────────────────────────────── */
.search-wrap { position: relative; margin-bottom: 12px; }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search-clear {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: var(--indigo-xl); border: none; border-radius: 50%;
  width: 22px; height: 22px; cursor: pointer; display: none;
  align-items: center; justify-content: center; color: var(--indigo);
  font-size: 14px; line-height: 1; transition: var(--transition);
}
.search-clear:hover { background: var(--indigo-l); color: #fff; }
.search-clear.visible { display: flex; }
#searchInput {
  width: 100%; padding: 14px 44px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border2);
  font-family: inherit; font-size: 15px; color: var(--text);
  background: var(--surface);
  box-shadow: var(--shadow-card);
  outline: none; transition: var(--transition);
}
#searchInput:focus {
  border-color: var(--indigo);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.12), var(--shadow-card);
}
.search-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.search-hint { font-size: 11px; color: var(--text3); }
.kbd { background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; padding: 1px 5px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); }

/* ─── RECENT SEARCHES ─────────────────────────────────────────────── */
.recent-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.recent-label { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.recent-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  background: var(--surface2); color: var(--indigo);
  border: 1px solid var(--border);
  cursor: pointer; transition: var(--transition);
  backdrop-filter: blur(4px);
}
.recent-tag:hover { background: var(--indigo-xl); border-color: var(--indigo-l); }

/* ─── FILTER CHIPS ────────────────────────────────────────────────── */
.chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
.chip {
  font-family: inherit; font-size: 12px; font-weight: 500;
  padding: 6px 16px; border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface2); color: var(--text2);
  cursor: pointer; transition: var(--transition);
  backdrop-filter: blur(4px);
}
.chip:hover { background: var(--indigo-xxl); color: var(--indigo); border-color: var(--indigo-l); }
.chip.active { background: var(--indigo); color: #fff; border-color: var(--indigo); box-shadow: 0 2px 8px rgba(99,102,241,0.3); }

/* ─── DROPDOWN ────────────────────────────────────────────────────── */
.dropdown-wrap { position: relative; }
#dropdown {
  display: none; position: absolute; top: 4px; left: 0; right: 0; z-index: 50;
  background: rgba(255,255,255,0.98);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(99,102,241,0.15), 0 2px 8px rgba(0,0,0,0.06);
  overflow: hidden; max-height: 240px; overflow-y: auto;
}
#dropdown.open { display: block; }
.drop-item {
  padding: 10px 16px; font-size: 13px; color: var(--text);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: background 0.12s;
}
.drop-item:last-child { border-bottom: none; }
.drop-item:hover, .drop-item.focused { background: var(--indigo-xxl); }
.drop-name { flex: 1; }
.drop-email { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.drop-badge { font-size: 10px; font-weight: 600; padding: 2px 9px; border-radius: 12px; flex-shrink: 0; }
.db-active   { background: var(--green-l); color: var(--green-d); }
.db-replaced { background: var(--amber-l); color: var(--amber-d); }
.match-hl { color: var(--indigo); font-weight: 600; }

/* ─── RESULTS HEADER ──────────────────────────────────────────────── */
.results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; min-height: 20px; }
.results-label { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }

/* ─── CARDS GRID ──────────────────────────────────────────────────── */
#results { display: flex; flex-direction: column; gap: 14px; }

/* ─── PAIR GROUP ──────────────────────────────────────────────────── */
.pair-group { display: flex; flex-direction: column; gap: 0; }
.pair-section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text3); padding: 0 4px; margin-bottom: 5px; margin-top: 12px;
}
.pair-section-label:first-child { margin-top: 0; }
.pair-connector {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
}
.connector-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(99,102,241,0.25), transparent); }
.connector-line.rev { background: linear-gradient(90deg, transparent, rgba(99,102,241,0.25)); }
.connector-badge {
  font-size: 10px; font-weight: 600; padding: 3px 12px; border-radius: 20px;
  background: var(--indigo-xl); color: var(--indigo);
  border: 1px solid rgba(99,102,241,0.2); white-space: nowrap;
}

/* ─── CARD ────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  transition: var(--transition);
  cursor: default;
  position: relative;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  transition: height 0.22s;
}
.card.active-card::before  { background: linear-gradient(90deg, #22c55e, #86efac); }
.card.replaced-card::before { background: linear-gradient(90deg, #f59e0b, #fcd34d); }
.card:hover {
  border-color: rgba(99,102,241,0.32);
  box-shadow: var(--shadow-hover);
  transform: translateY(-3px);
}
.card:hover::before { height: 4px; }
.card-inner { padding: 16px 18px; }
.card-top { display: flex; align-items: flex-start; gap: 13px; }
.avatar {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; letter-spacing: -0.5px;
  transition: var(--transition);
}
.card:hover .avatar { border-radius: 50%; }
.av-green  { background: var(--green-l);  color: var(--green-d); }
.av-amber  { background: var(--amber-l);  color: var(--amber-d); }
.av-indigo { background: var(--indigo-xl); color: var(--indigo-d); }
.av-auto   { background: var(--indigo-xl); color: var(--indigo-d); }
.card-info { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-email-sub { font-size: 12px; color: var(--indigo-l); margin-top: 2px; font-family: 'DM Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-pill {
  font-size: 10px; font-weight: 600; padding: 4px 11px; border-radius: 20px; flex-shrink: 0;
  letter-spacing: 0.03em;
}
.sp-active   { background: var(--green-l);  color: var(--green-d); }
.sp-replaced { background: var(--amber-l);  color: var(--amber-d); }
.card-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.card-row:last-child { margin-bottom: 0; }
.row-label { font-size: 11px; font-weight: 500; color: var(--text3); min-width: 78px; text-transform: uppercase; letter-spacing: 0.05em; }
.row-val { font-size: 13px; color: var(--text); flex: 1; font-family: 'DM Mono', monospace; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-val.missing { color: var(--text3); font-style: italic; font-family: inherit; }
.copy-btn {
  font-family: inherit; font-size: 10px; font-weight: 600;
  padding: 4px 11px; border-radius: 6px;
  border: 1px solid rgba(99,102,241,0.2);
  background: var(--indigo-xxl); color: var(--indigo);
  cursor: pointer; flex-shrink: 0; transition: var(--transition);
  letter-spacing: 0.02em;
}
.copy-btn:hover { background: var(--indigo); color: #fff; border-color: var(--indigo); }
.copy-btn:active { transform: scale(0.96); }
.copy-btn.copied { background: var(--green-l); color: var(--green-d); border-color: rgba(22,163,74,0.3); }

/* ─── REPLACED-BY STRIP ───────────────────────────────────────────── */
.replaced-by-strip {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(90deg, rgba(245,158,11,0.06), rgba(245,158,11,0.02));
  border-radius: var(--radius-sm); padding: 9px 12px;
  border: 1px solid rgba(245,158,11,0.18); margin-top: 10px;
}
.strip-av {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; background: var(--green-l); color: var(--green-d);
}
.strip-label { font-size: 11px; color: var(--amber); font-weight: 600; letter-spacing: 0.02em; }
.strip-name  { font-size: 13px; font-weight: 600; color: var(--text); }
.strip-email { font-size: 11px; color: var(--indigo-l); font-family: 'DM Mono', monospace; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

/* ─── EMPTY / WELCOME STATES ──────────────────────────────────────── */
.state-box {
  text-align: center; padding: 56px 24px;
  background: var(--surface); border-radius: var(--radius);
  border: 1px dashed var(--border2);
}
.state-icon { font-size: 40px; margin-bottom: 14px; }
.state-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.state-sub   { font-size: 13px; color: var(--text3); line-height: 1.6; }

/* ─── TOAST ───────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  color: #fff; font-size: 13px; font-weight: 500;
  padding: 11px 22px; border-radius: 30px;
  box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  display: flex; align-items: center; gap: 8px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 999; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ─── MODAL ───────────────────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(30,27,75,0.35); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius);
  box-shadow: 0 24px 64px rgba(30,27,75,0.25);
  padding: 28px; width: 100%; max-width: 480px;
  animation: modal-in 0.2s ease;
}
@keyframes modal-in { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: none; } }
.modal-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 20px; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 5px; }
.form-input, .form-select {
  width: 100%; padding: 10px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border2); font-family: inherit; font-size: 14px;
  color: var(--text); background: var(--bg); outline: none; transition: var(--transition);
}
.form-input:focus, .form-select:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }

/* ─── IMPORT PREVIEW TABLE ────────────────────────────────────────── */
.preview-table-wrap { max-height: 260px; overflow-y: auto; margin: 14px 0; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.preview-table th { background: var(--indigo-xxl); color: var(--indigo); padding: 7px 10px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; position: sticky; top: 0; }
.preview-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
.preview-table tr:last-child td { border-bottom: none; }
.preview-table tr:hover td { background: var(--indigo-xxl); }

/* ─── SCROLLBAR ───────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--indigo-xl); border-radius: 4px; }

/* ─── ANIMATIONS ──────────────────────────────────────────────────── */
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.card { animation: fadeUp 0.22s ease both; }

/* ─── RESPONSIVE ──────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .topbar { padding: 10px 14px; gap: 8px; }
  .topbar-actions { gap: 5px; }
  .btn { padding: 6px 10px; font-size: 11px; }
  .logo-name { font-size: 14px; }
  .main { padding: 16px 12px 60px; }
  .strip-email { display: none; }
  .card-name { font-size: 14px; }
}
</style>
</head>
<body>

<!-- ─── TOPBAR ──────────────────────────────────────── -->
<header class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="7" r="4" fill="white"/>
        <path d="M3 18c0-4 3.134-7 7-7s7 3 7 7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="logo-name">ContactLookup</div>
      <div class="logo-sub">JM Partners Directory</div>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="count-pill" id="countPill">93 contacts</span>
    <button class="btn" onclick="triggerImport()">⬆ Import Excel</button>
    <button class="btn" onclick="exportContacts()">⬇ Export</button>
    <button class="btn accent" onclick="openAddModal()">+ Add Contact</button>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm,.csv" style="display:none" onchange="handleImport(event)"/>
  </div>
</header>

<!-- ─── MAIN ────────────────────────────────────────── -->
<main class="main">

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="7.5" cy="7.5" r="5" stroke="#818cf8" stroke-width="1.7"/>
        <path d="M11.5 11.5L15 15" stroke="#818cf8" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </span>
    <input id="searchInput" type="text" placeholder="Search by name or email…" autocomplete="off"
      oninput="onSearch()" onkeydown="onKeyDown(event)" onfocus="onFocus()" onblur="onBlur()"/>
    <button class="search-clear" id="clearBtn" onclick="clearSearch()" title="Clear">✕</button>
  </div>

  <div class="search-meta">
    <span class="search-hint">Min 3 chars · <span class="kbd">↑↓</span> navigate · <span class="kbd">↵</span> select · <span class="kbd">Esc</span> close</span>
  </div>

  <!-- Recent searches -->
  <div class="recent-row" id="recentRow" style="display:none">
    <span class="recent-label">Recent:</span>
    <span id="recentTags"></span>
  </div>

  <!-- Dropdown -->
  <div class="dropdown-wrap">
    <div id="dropdown"></div>
  </div>

  <!-- Filter chips -->
  <div class="chips">
    <button class="chip active" data-filter="all"          onclick="setFilter('all',this)">All</button>
    <button class="chip"        data-filter="Active"       onclick="setFilter('Active',this)">Active</button>
    <button class="chip"        data-filter="Replaced"     onclick="setFilter('Replaced',this)">Replaced</button>
    <button class="chip"        data-filter="missing"      onclick="setFilter('missing',this)">Missing Email</button>
  </div>

  <!-- Results -->
  <div class="results-header">
    <span class="results-label" id="resultsLabel"></span>
  </div>
  <div id="results"></div>
</main>

<!-- ─── TOAST ───────────────────────────────────────── -->
<div id="toast">
  <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="white" stroke-width="1.4"/><path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastMsg">Copied!</span>
</div>

<!-- ─── ADD / EDIT MODAL ─────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle">Add Contact</div>
    <div class="form-group">
      <label class="form-label">Full Name *</label>
      <input class="form-input" id="f-name" placeholder="e.g. Jane Smith"/>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="f-email" placeholder="jane@jmpartners.com" type="email"/>
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>

// ─── STATE ──────────────────────────────────────────────────────────
let contacts = [];
let currentFilter = 'all';
let currentQuery  = '';
let dropFocusIdx  = -1;
let dropItems     = [];
let recentSearches = [];
let editingIdx    = null;
let pendingImport = null;
let toastTimer    = null;

// ─── INIT ────────────────────────────────────────────────────────────
function init() {
  const saved = localStorage.getItem('jm_contacts');
  contacts = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(SEED_DATA));
  const savedRecent = localStorage.getItem('jm_recent');
  recentSearches = savedRecent ? JSON.parse(savedRecent) : [];
  updateCount();
  renderResults();
}

function save() {
  localStorage.setItem('jm_contacts', JSON.stringify(contacts));
}
function saveRecent() {
  localStorage.setItem('jm_recent', JSON.stringify(recentSearches));
}
function updateCount() {
  const unique = dedupe(contacts).length;
  document.getElementById('countPill').textContent = unique + ' contacts';
}

// ─── DEDUP ───────────────────────────────────────────────────────────
function dedupe(arr) {
  const seen = new Set();
  return arr.filter(c => {
    const key = c.name.toLowerCase().trim();
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
}

// ─── AVATAR INITIALS ──────────────────────────────────────────────────
function initials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// ─── AVATAR COLOR ────────────────────────────────────────────────────
const AV_COLORS = ['av-indigo','av-green','av-amber'];
function avatarColor(name, forceGreen) {
  if (forceGreen) return 'av-green';
  const i = (name || '').charCodeAt(0) % AV_COLORS.length;
  return AV_COLORS[i];
}

// ─── HIGHLIGHT MATCH ─────────────────────────────────────────────────
function highlight(text, query) {
  if (!query || !text) return escHtml(text || '');
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escHtml(text);
  return escHtml(text.slice(0, idx))
    + '<span class="match-hl">' + escHtml(text.slice(idx, idx + query.length)) + '</span>'
    + escHtml(text.slice(idx + query.length));
}
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── FUZZY SEARCH ────────────────────────────────────────────────────
function fuzzyMatch(text, q) {
  if (!text || !q) return false;
  text = text.toLowerCase(); q = q.toLowerCase();
  if (text.includes(q)) return true;
  let ti = 0;
  for (let qi = 0; qi < q.length; qi++) {
    ti = text.indexOf(q[qi], ti);
    if (ti === -1) return false;
    ti++;
  }
  return true;
}

// ─── FILTER ──────────────────────────────────────────────────────────
function applyFilter(list) {
  if (currentFilter === 'all')     return list;
  if (currentFilter === 'missing') return list.filter(c => !c.email);
  return list.filter(c => c.status === currentFilter);
}

// ─── SEARCH LOGIC ────────────────────────────────────────────────────
function searchContacts(q) {
  const base = dedupe(contacts);
  if (!q || q.length < 3) return applyFilter(base);
  const ql = q.toLowerCase();
  return applyFilter(base).filter(c =>
    fuzzyMatch(c.name, q) ||
    fuzzyMatch(c.email, q) ||
    fuzzyMatch(c.replacedBy, q) ||
    fuzzyMatch(c.replacementEmail, q)
  );
}

// ─── RENDER RESULTS ──────────────────────────────────────────────────
function renderResults() {
  const q = currentQuery;
  const list = searchContacts(q);
  const el = document.getElementById('results');
  const lbl = document.getElementById('resultsLabel');

  if (!q && currentFilter === 'all') {
    lbl.textContent = '';
    el.innerHTML = `<div class="state-box">
      <div class="state-icon">🔍</div>
      <div class="state-title">Search the directory</div>
      <div class="state-sub">Type at least 3 characters to find a contact.<br/>Use the filter chips to browse by status.</div>
    </div>`;
    return;
  }

  if (list.length === 0) {
    lbl.textContent = q ? `No results for "${q}"` : 'No contacts match this filter';
    el.innerHTML = `<div class="state-box">
      <div class="state-icon">😕</div>
      <div class="state-title">No contacts found</div>
      <div class="state-sub">${q ? 'Try a different name or email.' : 'No contacts match this filter.'}</div>
    </div>`;
    return;
  }

  const suffix = list.length === 1 ? 'result' : 'results';
  lbl.textContent = q ? `${list.length} ${suffix} for "${q}"` : `${list.length} ${suffix}`;

  // Group: Replaced contacts shown as pair (replacement active first, then original)
  const shown = new Set();
  const groups = [];

  list.forEach((c, i) => {
    if (shown.has(c.name)) return;
    shown.add(c.name);

    if (c.status === 'Replaced') {
      // Find replacement contact in full contacts list
      const repName = (c.replacedBy || '').toLowerCase().replace(/\s+/g,'');
      const repContact = dedupe(contacts).find(r =>
        r.status === 'Active' &&
        (r.name.toLowerCase().replace(/\s+/g,'') === repName ||
         (c.replacementEmail && r.email && r.email.toLowerCase() === c.replacementEmail.toLowerCase()))
      );
      groups.push({ type: 'pair', original: c, replacement: repContact, repEmail: c.replacementEmail });
    } else {
      groups.push({ type: 'single', contact: c });
    }
  });

  el.innerHTML = '';
  groups.forEach((g, gi) => {
    const delay = gi * 0.04;
    if (g.type === 'single') {
      el.appendChild(buildActiveCard(g.contact, q, delay));
    } else {
      el.appendChild(buildPairGroup(g, q, delay));
    }
  });
}

// ─── BUILD ACTIVE CARD ───────────────────────────────────────────────
function buildActiveCard(c, q, delay) {
  const div = document.createElement('div');

// ─── DROPDOWN ────────────────────────────────────────────────────────
function renderDropdown(q) {
  const dd = document.getElementById('dropdown');
  if (!q || q.length < 3) { closeDropdown(); return; }
  const base = dedupe(contacts);
  const matches = base.filter(c =>
    fuzzyMatch(c.name, q) || fuzzyMatch(c.email, q)
  ).slice(0, 7);

  if (!matches.length) { closeDropdown(); return; }

  dropFocusIdx = -1;
  dd.innerHTML = matches.map((c, i) => `
    <div class="drop-item" data-idx="${i}"
      onmousedown="selectDropItem(${i})"
      onmouseover="setDropFocus(${i})">
      <div>
        <div class="drop-name">${highlight(c.name, q)}</div>
        ${c.email ? `<div class="drop-email">${highlight(c.email, q)}</div>` : ''}
      </div>
      <span class="drop-badge ${c.status==='Active'?'db-active':'db-replaced'}">${c.status}</span>
    </div>`).join('');
  dd.classList.add('open');
}

function closeDropdown() {
  document.getElementById('dropdown').classList.remove('open');
  dropFocusIdx = -1; dropItems = [];
}

function setDropFocus(i) {
  dropFocusIdx = i;
  document.querySelectorAll('.drop-item').forEach((el, j) => {
    el.classList.toggle('focused', j === i);
  });
}

function selectDropItem(i) {
  const c = dropItems[i];
  if (!c) return;
  document.getElementById('searchInput').value = c.name;
  currentQuery = c.name;
  addRecent(c.name);
  closeDropdown();
  renderResults();
  updateClearBtn();
}

// ─── SEARCH EVENTS ───────────────────────────────────────────────────
function onSearch() {
  const q = document.getElementById('searchInput').value.trim();
  currentQuery = q;
  updateClearBtn();
  renderDropdown(q);
  renderResults();
}

function onKeyDown(e) {
  const dd = document.getElementById('dropdown');
  if (!dd.classList.contains('open')) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setDropFocus(Math.min(dropFocusIdx + 1, dropItems.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setDropFocus(Math.max(dropFocusIdx - 1, 0));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (dropFocusIdx >= 0) selectDropItem(dropFocusIdx);
    else closeDropdown();
  } else if (e.key === 'Escape') {
    closeDropdown();
  }
}

function onFocus() {
  const q = document.getElementById('searchInput').value.trim();
  if (q.length >= 3) renderDropdown(q);
  showRecent();
}

function onBlur() {
  setTimeout(closeDropdown, 150);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  currentQuery = '';
  updateClearBtn();
  closeDropdown();
  renderResults();
}

function updateClearBtn() {
  const btn = document.getElementById('clearBtn');
  const q = document.getElementById('searchInput').value;
  btn.classList.toggle('visible', q.length > 0);
}

// ─── RECENT SEARCHES ─────────────────────────────────────────────────
function addRecent(q) {
  recentSearches = [q, ...recentSearches.filter(r => r !== q)].slice(0, 5);
  saveRecent();
  showRecent();
}

function showRecent() {
  const row = document.getElementById('recentRow');
  const tags = document.getElementById('recentTags');
  if (!recentSearches.length) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  tags.innerHTML = recentSearches.map(r =>
    `<span class="recent-tag" onclick="applyRecent('${escHtml(r)}')">${escHtml(r)}</span>`
  ).join('');
}

function applyRecent(q) {
  document.getElementById('searchInput').value = q;
  currentQuery = q;
  updateClearBtn();
  closeDropdown();
  renderResults();
}

// ─── FILTER CHIPS ────────────────────────────────────────────────────
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderResults();
}

// ─── COPY EMAIL ──────────────────────────────────────────────────────
function copyEmail(email, btn) {
  navigator.clipboard.writeText(email).then(() => {
    if (btn) {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
    }
    showToast('Email copied: ' + email);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = email; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('Email copied: ' + email);
  });
}

// ─── TOAST ───────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ─── ADD / EDIT MODAL ────────────────────────────────────────────────
function openAddModal() {
  editingIdx = null;
  document.getElementById('modalTitle').textContent = 'Add Contact';
  document.getElementById('f-name').value = '';
  document.getElementById('f-email').value = '';
  document.getElementById('f-status').value = 'Active';
  document.getElementById('f-replacedBy').value = '';
  document.getElementById('f-replacementEmail').value = '';
  document.getElementById('replaced-fields').style.display = 'none';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditModal(idx) {
  if (idx < 0 || idx >= contacts.length) return;
  editingIdx = idx;
  const c = contacts[idx];
  document.getElementById('modalTitle').textContent = 'Edit Contact';
  document.getElementById('f-name').value = c.name || '';
  document.getElementById('f-email').value = c.email || '';
  document.getElementById('f-status').value = c.status || 'Active';
  document.getElementById('f-replacedBy').value = c.replacedBy || '';
  document.getElementById('f-replacementEmail').value = c.replacementEmail || '';
  toggleReplaced();
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('modalOverlay').classList.add('open');
}

function toggleReplaced() {
  const s = document.getElementById('f-status').value;
  document.getElementById('replaced-fields').style.display = s === 'Replaced' ? 'block' : 'none';
}

function saveContact() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { showToast('Name is required'); return; }
  const c = {
    name,
    email: document.getElementById('f-email').value.trim(),
    status: document.getElementById('f-status').value,
    replacedBy: document.getElementById('f-replacedBy').value.trim(),
    replacementEmail: document.getElementById('f-replacementEmail').value.trim()
  };
  if (editingIdx !== null && editingIdx >= 0) {
    contacts[editingIdx] = c;
    showToast('Contact updated');
  } else {
    contacts.push(c);
    showToast('Contact added');
  }
  save(); updateCount(); closeModalDirect(); renderResults();
}

function deleteContact() {
  if (editingIdx === null) return;
  if (!confirm('Delete this contact?')) return;
  contacts.splice(editingIdx, 1);
  save(); updateCount(); closeModalDirect();
  showToast('Contact deleted');
  renderResults();
}

function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); }

// ─── IMPORT EXCEL ─────────────────────────────────────────────────────
function triggerImport() { document.getElementById('fileInput').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!rows.length) { showToast('No data found in file'); return; }

      // Map columns flexibly
      const mapped = rows.map(r => {
        const keys = Object.keys(r);
        const get = (...names) => {
          for (const n of names) {
            const k = keys.find(k => k.toLowerCase().includes(n.toLowerCase()));
            if (k) return String(r[k]).trim();
          }
          return '';
        };
        const emailRaw = get('email','clean');
        const emailMatch = emailRaw.match(/[\w.+\-]+@[\w.\-]+\.\w+/);
        return {
          name: get('full name','name'),
          email: emailMatch ? emailMatch[0] : '',
          status: get('status') || 'Active',
          replacedBy: get('replaced by','replacedby'),
          replacementEmail: (() => {
            const raw = get('replacement email','replacementemail');
            const m = raw.match(/[\w.+\-]+@[\w.\-]+\.\w+/);
            return m ? m[0] : '';
          })()
        };
      }).filter(c => c.name);

      pendingImport = mapped;
      showPreview(mapped);
    } catch(err) {
      showToast('Error reading file: ' + err.message);
    }
  };
  reader.readAsBinaryString(file);
}

function showPreview(data) {
  document.getElementById('previewInfo').textContent = `${data.length} contacts found. Review before importing.`;
  const wrap = document.getElementById('previewTableWrap');
  const sample = data.slice(0, 20);
  wrap.innerHTML = `<table class="preview-table">
    <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Replaced By</th></tr></thead>
    <tbody>${sample.map(c => `<tr>
      <td>${escHtml(c.name)}</td>
      <td style="font-family:'DM Mono',monospace">${escHtml(c.email) || '<span style="color:var(--text3)">—</span>'}</td>
      <td><span class="drop-badge ${c.status==='Active'?'db-active':'db-replaced'}">${escHtml(c.status)}</span></td>
      <td>${escHtml(c.replacedBy) || '<span style="color:var(--text3)">—</span>'}</td>
    </tr>`).join('')}
    ${data.length > 20 ? `<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:10px">...and ${data.length - 20} more</td></tr>` : ''}
    </tbody></table>`;
  document.getElementById('previewOverlay').classList.add('open');
}

function confirmImport() {
  if (!pendingImport) return;
  contacts = pendingImport;
  pendingImport = null;
  save(); updateCount(); closePreviewDirect();
  showToast(`Imported ${contacts.length} contacts`);
  renderResults();
}

function closePreview(e) { if (e.target === document.getElementById('previewOverlay')) closePreviewDirect(); }
function closePreviewDirect() { document.getElementById('previewOverlay').classList.remove('open'); pendingImport = null; }

// ─── EXPORT ───────────────────────────────────────────────────────────
function exportContacts() {
  const data = dedupe(contacts).map(c => ({
    'Full Name': c.name,
    'Clean Email': c.email,
    'Status': c.status,
    'Replaced By': c.replacedBy,
    'Replacement Email': c.replacementEmail
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Employee_Data');
  XLSX.writeFile(wb, 'JMPartners_Contacts.xlsx');
  showToast('Exported to Excel');
}

// ─── BOOT ─────────────────────────────────────────────────────────────
init();
showRecent();
</script>
